openapi: 3.0.3
info:
  title: Credential lab API
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /oauth/token:
    post:
      summary: Issue a fresh opaque bearer token
      responses:
        "200":
          description: Opaque token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: {type: string, minLength: 1}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer, enum: [3600]}
  /api/orders/{order_id}:
    get:
      summary: Exercise an authenticated missing-order lookup
      security: [{DemoOpaque: []}]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: No orders exist in this fixture
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/login:
    post:
      summary: Issue a demo HS256 JWT for a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, minLength: 1}
      responses:
        "200":
          description: Demo JWT
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, subject]
                properties:
                  access_token: {type: string, minLength: 1}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer, enum: [86400]}
                  subject: {type: string, minLength: 1}
        "400":
          description: Missing or invalid username
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/profile:
    get:
      summary: Read the signed JWT subject
      security: [{DemoJWT: []}]
      responses:
        "200":
          description: Subject profile
          content:
            application/json:
              schema:
                type: object
                required: [subject, plan]
                properties:
                  subject: {type: string, minLength: 1}
                  plan: {type: string, enum: [pro]}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/account:
    get:
      summary: Read a demo Basic account
      security: [{DemoBasic: []}]
      responses:
        "200":
          description: Account information
          content:
            application/json:
              schema:
                type: object
                required: [account, orders]
                properties:
                  account: {type: string, enum: [acme, globex]}
                  orders: {type: integer, minimum: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    DemoJWT: {type: http, scheme: bearer, bearerFormat: JWT}
    DemoBasic: {type: http, scheme: basic}
    DemoOpaque: {type: http, scheme: bearer}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
