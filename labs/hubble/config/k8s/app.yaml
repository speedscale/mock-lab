apiVersion: v1
kind: Namespace
metadata:
  name: netpath-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: netpath-demo
  labels:
    app.kubernetes.io/name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: mock-lab-hubble:local
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8080"
            # Real in-cluster service name: this call is resolved by cluster DNS
            # and then dialed pod-to-pod, so Cilium and Hubble observe it.
            - name: DOWNSTREAM_URL
              value: http://catalog-fixture.netpath-demo.svc.cluster.local:8090
            # Bound the dependency wait so a blackholed packet becomes a fast,
            # deterministic 502 instead of a multi-minute TCP retry.
            - name: DOWNSTREAM_TIMEOUT
              value: 5s
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: netpath-demo
spec:
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-fixture
  namespace: netpath-demo
  labels:
    app.kubernetes.io/name: catalog-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-fixture
    spec:
      containers:
        - name: catalog-fixture
          image: mock-lab-hubble:local
          imagePullPolicy: Never
          command: ["/catalog-fixture"]
          env:
            - name: PORT
              value: "8090"
            - name: PROJECTS_DELAY
              value: 25ms
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-fixture
  namespace: netpath-demo
spec:
  selector:
    app.kubernetes.io/name: catalog-fixture
  ports:
    - name: http
      port: 8090
      targetPort: http
