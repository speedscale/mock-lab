apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-fixture
  namespace: catalog-fixture
  labels:
    app.kubernetes.io/name: catalog-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-fixture
    spec:
      containers:
        - name: catalog-fixture
          image: mock-lab-catalog:local
          imagePullPolicy: Never
          command: ["/catalog-fixture"]
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-fixture
  namespace: catalog-fixture
spec:
  selector:
    app.kubernetes.io/name: catalog-fixture
  ports:
    - name: http
      port: 8090
      targetPort: http
