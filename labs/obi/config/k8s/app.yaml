apiVersion: v1
kind: Namespace
metadata:
  name: opaque-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: opaque-demo
  labels:
    app.kubernetes.io/name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: mock-lab-obi:local
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8080"
            - name: DOWNSTREAM_URL
              value: http://localhost:18090
            - name: HTTP_PROXY
              value: http://host.minikube.internal:4140
            - name: HTTPS_PROXY
              value: http://host.minikube.internal:4140
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: opaque-demo
spec:
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-fixture
  namespace: opaque-demo
  labels:
    app.kubernetes.io/name: catalog-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-fixture
    spec:
      containers:
        - name: catalog-fixture
          image: mock-lab-obi:local
          imagePullPolicy: Never
          command: ["/catalog-fixture"]
          env:
            - name: PORT
              value: "8090"
            - name: PROJECTS_DELAY
              value: 120ms
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-fixture
  namespace: opaque-demo
spec:
  selector:
    app.kubernetes.io/name: catalog-fixture
  ports:
    - name: http
      port: 8090
      targetPort: http
