# SQL Server 2022 Developer edition for the sqlserver lab. It listens on
# 127.0.0.1:14330, so it can run next to a SQL Server you already have on 1433.
# The image is linux/amd64 only; Docker Desktop on Apple silicon runs it under
# emulation, which is slow to start but fine for the lab.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lab-Admin-2026!}
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  # The image has no init directory like the Postgres and MySQL images, so a
  # one-shot container loads the schema once the server answers.
  setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lab-Admin-2026!}
    volumes:
      - ./db/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /schema.sql"]
    restart: "no"
