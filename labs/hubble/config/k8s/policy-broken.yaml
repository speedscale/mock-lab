# The regression under test.
#
# A platform change tightens egress for catalog-api. The author remembered that
# the pod needs cluster DNS and wrote that rule. They did not add a rule for the
# catalog-fixture dependency.
#
# In Cilium, the first policy that selects a pod for egress switches that pod
# from default-allow to default-deny for egress. So this "add DNS" change also
# silently blackholes every other outbound connection, including the one this
# application depends on. Packets are dropped, not rejected, so the client sees
# a hang rather than a connection error.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: catalog-api-egress
  namespace: netpath-demo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
