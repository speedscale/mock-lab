apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: catalog-api
  labels:
    app.kubernetes.io/name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: mock-lab-catalog:local
          imagePullPolicy: Never
          env:
            - name: APP_ADDR
              value: :8080
            - name: PPROF_ADDR
              value: :6060
            - name: DOWNSTREAM_URL
              value: http://catalog-fixture.catalog-fixture.svc.cluster.local:8090
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: catalog-api
spec:
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
