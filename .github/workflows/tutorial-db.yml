name: tutorial-db

# tutorial-db runs the tutorial's Postgres without Docker. Test it on every OS
# readers use, and publish prebuilt binaries to the `tutorial-db` release when
# it changes on main, so readers without Go can download one file.
on:
  push:
    paths:
      - 'tutorial/db/**'
      - 'tutorial/contract/schema.sql'
      - '.github/workflows/tutorial-db.yml'
  pull_request:
    paths:
      - 'tutorial/db/**'
      - 'tutorial/contract/schema.sql'
      - '.github/workflows/tutorial-db.yml'

permissions:
  contents: read

jobs:
  test:
    name: tutorial-db ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tutorial/db
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
        cache-dependency-path: tutorial/db/go.sum
    - name: Schema copy matches the contract
      run: diff ../contract/schema.sql schema.sql
    - run: go vet ./...
    - run: go test -count=1 -v ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tutorial/db
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
        cache-dependency-path: tutorial/db/go.sum
    - name: Build
      run: |
        set -euo pipefail
        mkdir -p dist
        for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
          os=${target%/*} arch=${target#*/}
          ext=""; [ "$os" = windows ] && ext=.exe
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/tutorial-db-$os-$arch$ext" .
        done
        ls -l dist
    - name: Publish to the tutorial-db release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        notes="tutorial-db runs the proxymock tutorial's Postgres without Docker. Built from ${GITHUB_SHA}. See tutorial/README.md."
        if ! gh release view tutorial-db >/dev/null 2>&1; then
          gh release create tutorial-db --title "tutorial-db" --notes "$notes" --target "$GITHUB_SHA" --latest=false
        else
          gh release edit tutorial-db --notes "$notes"
        fi
        gh release upload tutorial-db dist/* --clobber
