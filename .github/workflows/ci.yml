name: CI

on:
  push:
    # stats-project-count and category-totals are demo fixtures: each carries a
    # deliberate bug in all seven apps so the quality-loop demo has something
    # real to find. category-totals returns 500, which this suite correctly
    # fails on, so running CI there is permanent red noise. Neither branch is
    # ever merged. To see the contrast the demo is about, run
    # ./lab/tests/run_tests.sh locally: it passes on stats-project-count while
    # the endpoint answers a wrong total, and fails on category-totals.
    branches-ignore:
      - stats-project-count
      - category-totals
  pull_request:

# Builds and smoke-tests every demo app against the bundled reference downstream
# (server/), so CI is fully self-contained — no external endpoint, no AWS.
jobs:
  validate:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: go,     start: "cd go && go run ." }
          - { lang: node,   start: "node node/index.js" }
          - { lang: python, start: "python3 python/app.py" }
          - { lang: java,   start: "java java/App.java" }
          - { lang: ruby,   start: "ruby ruby/app.rb" }
          - { lang: dotnet, start: "dotnet run --project dotnet/demo.csproj" }
          - { lang: cpp,    start: "cd cpp && c++ -std=c++17 main.cpp -o app -lcurl && ./app" }
    steps:
      - uses: actions/checkout@v4

      # Go is always needed to run the reference downstream server.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - if: matrix.lang == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: validate ${{ matrix.lang }} app against the reference downstream
        run: |
          set -euo pipefail

          # 1. reference downstream (static CNCF API) on :8090
          (cd lab/server && go run .) >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8090/healthz >/dev/null && break; sleep 1; done

          # 2. the demo app, pointed at it
          DOWNSTREAM_URL=http://localhost:8090 PORT=8080 ${{ matrix.start }} >/tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/ >/dev/null && break; sleep 1; done

          # 3. drive the whole API (read endpoints + oauth/order flow); the script
          #    asserts 24 projects and that the auth flow returns a token + order.
          DELAY=0 PORT=8080 ./lab/tests/run_tests.sh
          echo "${{ matrix.lang }} app OK"
