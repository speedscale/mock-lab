name: Tutorial images and Kubernetes

# The advanced (cluster) tutorial deploys the tutorial app from published
# images with the manifests in tutorial/k8s. On every change this workflow
# deploys each language to a kind cluster and runs the in-cluster traffic Job;
# on main it also publishes the images, multi-arch so they run on Apple
# silicon kind and minikube as well as amd64 clusters.
on:
  push:
    paths:
      - 'tutorial/**'
      - '.github/workflows/tutorial-images.yml'
  pull_request:
    paths:
      - 'tutorial/**'
      - '.github/workflows/tutorial-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k8s:
    name: kind ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, java, python, node]
    steps:
    - uses: actions/checkout@v4
    - name: Schema copy matches the contract
      run: diff tutorial/contract/schema.sql tutorial/k8s/base/schema.sql
    - name: Build the app and traffic images
      working-directory: tutorial
      run: |
        set -euo pipefail
        docker build -t mock-lab-tutorial-${{ matrix.lang }}:ci ${{ matrix.lang }}
        docker build -t mock-lab-tutorial-traffic:ci -f k8s/traffic/Dockerfile .
    - uses: helm/kind-action@v1
      with:
        cluster_name: tutorial
    - name: Deploy the ${{ matrix.lang }} overlay
      working-directory: tutorial/k8s
      run: |
        set -euo pipefail
        kind load docker-image --name tutorial mock-lab-tutorial-${{ matrix.lang }}:ci mock-lab-tutorial-traffic:ci
        kubectl kustomize overlays/${{ matrix.lang }} \
          | sed -E 's#ghcr.io/speedscale/(mock-lab-tutorial-[a-z]+):latest#\1:ci#' \
          | kubectl apply -f -
        kubectl -n tutorial rollout status deploy/postgres --timeout=180s
        kubectl -n tutorial rollout status deploy/tutorial-orders --timeout=300s
    - name: Run the traffic Job
      working-directory: tutorial/k8s
      run: |
        set -euo pipefail
        job=$(sed 's#ghcr.io/speedscale/mock-lab-tutorial-traffic:latest#mock-lab-tutorial-traffic:ci#' traffic/job.yaml | kubectl create -f - -o name)
        if ! kubectl -n tutorial wait --for=condition=complete "$job" --timeout=300s; then
          kubectl -n tutorial logs "$job" --all-containers || true
          exit 1
        fi
        kubectl -n tutorial logs "$job" -c traffic | tail -3
        kubectl -n tutorial logs "$job" -c traffic | grep -q "sent 135 requests, 0 unexpected"
    - name: Diagnostics
      if: failure()
      run: |
        kubectl -n tutorial get all || true
        kubectl -n tutorial logs deploy/tutorial-orders --tail=50 || true

  publish:
    needs: k8s
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: go
            context: tutorial/go
            file: tutorial/go/Dockerfile
          - image: java
            context: tutorial/java
            file: tutorial/java/Dockerfile
          - image: python
            context: tutorial/python
            file: tutorial/python/Dockerfile
          - image: node
            context: tutorial/node
            file: tutorial/node/Dockerfile
          - image: traffic
            context: tutorial
            file: tutorial/k8s/traffic/Dockerfile
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/speedscale/mock-lab-tutorial-${{ matrix.image }}:latest
          ghcr.io/speedscale/mock-lab-tutorial-${{ matrix.image }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/speedscale/mock-lab
          org.opencontainers.image.description=proxymock tutorial ${{ matrix.image }} (speedscale/mock-lab tutorial/)
          org.opencontainers.image.licenses=Apache-2.0
